name: E2E Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  e2e-tests:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './idhrts_frontend/package-lock.json'

    - name: Install Backend Dependencies
      working-directory: ./idhrts_backend
      run: |
        python -m venv venv
        source venv/bin/activate
        pip install -r requirements.txt

    - name: Apply Database Migrations
      working-directory: ./idhrts_backend
      run: |
        source venv/bin/activate
        python manage.py migrate

    - name: Start Django Backend
      working-directory: ./idhrts_backend
      run: |
        source venv/bin/activate
        python manage.py runserver 8000 &

    - name: Wait for Backend to Boot
      run: npx wait-on tcp:8000 --timeout 30000

    - name: Install Frontend Dependencies
      working-directory: ./idhrts_frontend
      run: npm ci

    - name: Build Frontend
      working-directory: ./idhrts_frontend
      run: npm run build

    - name: Install Playwright Browsers
      working-directory: ./idhrts_frontend
      run: npx playwright install --with-deps chromium

    - name: Run Playwright E2E Tests
      working-directory: ./idhrts_frontend
      # Playwright's webServer config will automatically boot 'npm run dev' on port 3000
      run: npx playwright test e2e/real/ --project=real-e2e
      env:
        CI: true
        # Default SQLite is used for backend since DATABASE_URL is not provided here

    - name: Upload Playwright Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: ./idhrts_frontend/playwright-report/
        retention-days: 7
