name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: idhrts_test_db
          POSTGRES_USER: idhrts_user
          POSTGRES_PASSWORD: changeme123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install backend dependencies
      run: |
        cd idhrts_backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Django tests
      env:
        DATABASE_ENGINE: django.db.backends.postgresql
        DATABASE_NAME: idhrts_test_db
        DATABASE_USER: idhrts_user
        DATABASE_PASSWORD: changeme123
        DATABASE_HOST: localhost
        DATABASE_PORT: 5432
        CELERY_BROKER_URL: redis://localhost:6379/0
      run: |
        cd idhrts_backend
        python manage.py test

  test-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js 18
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install frontend dependencies
      run: |
        cd idhrts_frontend
        npm ci

    - name: Build Next.js
      env:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api
      run: |
        cd idhrts_frontend
        npm run build

  e2e-tests:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Run Docker Compose Environment
      run: |
        docker-compose up -d db redis backend frontend
        
    - name: Wait for backend to be ready
      run: |
        echo "Waiting for backend..."
        for i in {1..30}; do
          curl -s http://localhost:8000/api/ > /dev/null && break
          sleep 2
        done

    - name: Set up Node.js 18
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Playwright & Dependencies
      run: |
        cd idhrts_frontend
        npm ci
        npx playwright install --with-deps chromium

    - name: Run Playwright E2E Tests
      env:
        USE_DOCKER: "1"
      run: |
        cd idhrts_frontend
        npx playwright test e2e/real/ --project=real-e2e

    - name: Upload Playwright Report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: playwright-report
        path: idhrts_frontend/playwright-report/
        retention-days: 7
